# One-shot migration: copies all Krux data out of Supabase into the repo.
# Delete this workflow once it has run.
name: Export Supabase data

on:
  push:
    branches: [claude/admiring-hopper-cqhagj]
    paths: [.github/workflows/supabase-export.yml, migration/export_supabase.py]

permissions:
  contents: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests Pillow
      - run: python migration/export_supabase.py
      - name: Commit exported data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A krux-web/data krux-web/public/article-images krux-pipeline/data supabase-export
          git commit -m "Export Krux data and images out of Supabase"
          git push
