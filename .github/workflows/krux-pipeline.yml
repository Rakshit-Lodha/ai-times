# Daily Krux content pipeline (replaces the old Render cron job).
# New stories and images are committed back to the repo, which triggers a
# Vercel redeploy of krux.news.
name: Krux daily pipeline

on:
  schedule:
    - cron: "7 0 * * *" # 05:37 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Process a specific date (YYYY-MM-DD). Leave empty for yesterday."
        required: false

permissions:
  contents: write

concurrency:
  group: krux-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: krux-pipeline/requirements.txt
      - run: pip install -r krux-pipeline/requirements.txt
      - name: Run pipeline
        working-directory: krux-pipeline
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_DATE: ${{ inputs.date }}
        run: python -m src ${RUN_DATE:+--date "$RUN_DATE"}
      - name: Commit new stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add krux-web/data krux-web/public/article-images krux-pipeline/data
          if git diff --cached --quiet; then
            echo "No new content"
            exit 0
          fi
          git commit -m "Krux stories for $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase
          git push
